version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: pki_postgres_prod
    environment:
      POSTGRES_DB: ${DB_NAME:-chinhquyendt}
      POSTGRES_USER: ${DB_USER:-pnthanh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pnthanh2001}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pnthanh} -d ${DB_NAME:-chinhquyendt}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - pki_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: pki_redis_prod
    restart: always
    networks:
      - pki_network

  # Django Backend with Gunicorn
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: pki_backend_prod
    volumes:
      - static_volume:/app/static
      - media_volume:/app/hoso/static
      - logs_volume:/app/logs
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_HOST=db
      - DATABASE_NAME=${DB_NAME:-chinhquyendt}
      - DATABASE_USER=${DB_USER:-pnthanh}
      - DATABASE_PASSWORD=${DB_PASSWORD:-pnthanh2001}
      - DATABASE_PORT=5432
      - PKI_MASTER_KEY=${PKI_MASTER_KEY}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - pki_network

  # React Frontend (build only)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-/api}
    container_name: pki_frontend_prod
    volumes:
      - frontend_build:/app/build
    networks:
      - pki_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: pki_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
      - frontend_build:/app/frontend:ro
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - pki_network

volumes:
  postgres_data_prod:
  static_volume:
  media_volume:
  logs_volume:
  frontend_build:

networks:
  pki_network:
    driver: bridge
