version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: pki_postgres
    environment:
      POSTGRES_DB: chinhquyendt
      POSTGRES_USER: pnthanh
      POSTGRES_PASSWORD: pnthanh2001
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pnthanh -d chinhquyendt"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pki_network

  # Redis (for caching)
  redis:
    image: redis:7-alpine
    container_name: pki_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pki_network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pki_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/hoso/static
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_HOST=db
      - DATABASE_NAME=chinhquyendt
      - DATABASE_USER=pnthanh
      - DATABASE_PASSWORD=pnthanh2001
      - DATABASE_PORT=5432
      - PKI_MASTER_KEY=DEV_MASTER_KEY_32_BYTES_CHANGE!!
      - EMAIL_HOST_USER=your-email@gmail.com
      - EMAIL_HOST_PASSWORD=your-app-password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pki_network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pki_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=3000
    stdin_open: true
    depends_on:
      - backend
    networks:
      - pki_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  pki_network:
    driver: bridge
